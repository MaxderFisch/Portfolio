<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fotos — Max Aulinger</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./seitenwechsel.js"></script>
<script src="./support.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin="">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&amp;f[]=general-sans@400,500,600&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#000;color:#f2f2f2;font-family:'General Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
::selection{background:#f2f2f2;color:#000}
</style>
</helmet>

<dc-import name="Navi" aktiv="Fotos" hint-size="100%,0px"></dc-import>

<section data-k="stage" data-screen-label="Fotos Fläche" style="position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab">
  <div data-k="plane" style="position:absolute;left:0;top:0;width:{{ pw }};height:{{ ph }};transform-origin:0 0;will-change:transform">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="0">
      <figure data-i="{{ it.i }}" style="position:absolute;left:{{ it.l }};top:{{ it.t }};width:{{ it.w }};height:{{ it.h }};margin:0;overflow:hidden;background:#0d0d0e;opacity:0;cursor:zoom-in;transition:opacity .6s ease">
        <img data-im="" src="{{ it.th }}" alt="Foto" draggable="false" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transition:transform .8s cubic-bezier(.16,1,.3,1)">
      </figure>
    </sc-for>
  </div>

  <div style="position:absolute;left:clamp(12px,2.4vw,32px);bottom:clamp(12px,2.4vw,28px);z-index:5;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#8d8d92"><a href="impressum.html" style="color:inherit">Impressum</a> · <a href="datenschutz.html" style="color:inherit">Datenschutz</a></div>
  <div style="position:absolute;right:clamp(12px,2.4vw,32px);bottom:clamp(12px,2.4vw,28px);z-index:5;display:flex;gap:6px">
    <button onClick="{{ zoomOut }}" aria-label="Rauszoomen" style="width:44px;height:44px;border:1px solid rgba(255,255,255,.22);background:#000;color:#f2f2f2;font-family:'General Sans',system-ui,sans-serif;font-size:20px;line-height:1;cursor:pointer;transition:background .3s,color .3s" style-hover="background:#f2f2f2;color:#000">−</button>
    <button onClick="{{ zoomIn }}" aria-label="Reinzoomen" style="width:44px;height:44px;border:1px solid rgba(255,255,255,.22);background:#000;color:#f2f2f2;font-family:'General Sans',system-ui,sans-serif;font-size:20px;line-height:1;cursor:pointer;transition:background .3s,color .3s" style-hover="background:#f2f2f2;color:#000">+</button>
    <button onClick="{{ fitAll }}" aria-label="Alle Bilder" style="width:44px;height:44px;border:1px solid rgba(255,255,255,.22);background:#000;color:#f2f2f2;cursor:pointer;display:grid;place-items:center;transition:background .3s,color .3s" style-hover="background:#f2f2f2;color:#000"><span style="display:block;width:14px;height:14px;border:1.5px solid currentColor"></span></button>
  </div>

  <sc-if value="{{ focOn }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ prev }}" aria-label="Vorheriges Bild" style="position:absolute;left:clamp(8px,2vw,24px);top:50%;z-index:5;transform:translateY(-50%);width:48px;height:48px;border:1px solid rgba(255,255,255,.22);background:#000;color:#f2f2f2;font-size:20px;line-height:1;cursor:pointer;transition:background .3s,color .3s" style-hover="background:#f2f2f2;color:#000">←</button>
    <button onClick="{{ next }}" aria-label="Nächstes Bild" style="position:absolute;right:clamp(8px,2vw,24px);top:50%;z-index:5;transform:translateY(-50%);width:48px;height:48px;border:1px solid rgba(255,255,255,.22);background:#000;color:#f2f2f2;font-size:20px;line-height:1;cursor:pointer;transition:background .3s,color .3s" style-hover="background:#f2f2f2;color:#000">→</button>
    <button onClick="{{ close }}" aria-label="Schließen" style="position:absolute;right:clamp(12px,2.4vw,32px);top:78px;z-index:5;width:44px;height:44px;border:1px solid rgba(255,255,255,.22);background:#000;color:#f2f2f2;font-size:16px;line-height:1;cursor:pointer;transition:background .3s,color .3s" style-hover="background:#f2f2f2;color:#000">✕</button>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;abstand&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Eng&quot;,&quot;Mittel&quot;,&quot;Weit&quot;],&quot;default&quot;:&quot;Mittel&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Fläche&quot;},&quot;einblenden&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Fläche&quot;}}">

      [a('portraet-feld', 1700, 1109, 'portraet-feld'), a('portraet-brille', 933, 1400, 'men-0'), a('portraet-goldlicht', 925, 1400, 'men-2'), a('portraet-ares-quer', 1400, 933), a('portraet-gruen', 937, 1400, 'men-6'), a('portraet-himbeere', 933, 1400, 'men-4'), a('portraet-cap', 935, 1400, 'men-8'), p('dsc00788', 1022, 1400), p('dsc05781', 933, 1400), p('dsc02313', 1400, 1372), p('dsc01731', 1400, 933), p('dsc04625', 1400, 1000), f('portrait-jump-bw', 429, 646), f('portrait-two-snow', 660, 439)],
      [n('sa-donau-gold', 1400, 933), n('sa-donau-blau', 1700, 1133), n('sa-donau-gaense', 933, 1400), n('sa-bruecke-nebel', 1400, 933), n('sa-baum-bruecke', 1400, 933), n('sa-sonne-bruecke', 1400, 933), n('sa-badezimmer', 1500, 999)],

      [f('mountains-panorama', 700, 525), f('architecture-cctv', 425, 639), f('architecture-corner-lamp', 453, 682), f('church-tower-street', 429, 646), f('church-tower-tree', 411, 618), f('architecture-underpass', 688, 457), f('event-red-light', 700, 467)],
      ['dsc00466', 'dsc00452', 'dsc00536', 'dsc00537', 'dsc00554'].map(k),
      ['tag-tempeldach', 'dsc01051', 'dsc01053', 'dsc01054', 'tag-pavillon', 'tag-flagge'].map(k),
      ['tag-regen', 'tag-stadt-gold', 'tag-stadt-pastell', 'dsc07965'].map(k),
      ['dsc01025', 'dsc01024', 'dsc01382', 'dsc02176'].map(k),
      ['dsc01427', 'dsc01512', 'dsc01515', 'dsc01461', 'dsc01462', 'dsc01400'].map(k),
      ['dsc01970', 'dsc01971', 'dsc01973', 'dsc01976'].map(k),
      ['nacht-rauch', 'nacht-linien', 'nacht-strasse', 'dsc08579', 'bruecke', 'dsc09776', 'dsc00640', 'dsc09222', 'dsc08581'].map(k)

    G.forEach(g => g.forEach(it => {
      if (Math.max(it.w, it.h) > 360) it.th = 'assets/fotos-leicht/s/' + it.src.replace(/^assets\//, '').replace(/\.(webp|jpg)$/, '').replace(/\//g, '-') + '.webp';

  }

  part(ars, r) {

    const pre = [0]; ars.forEach(x => pre.push(pre[pre.length - 1] + x));

    for (let q = 1; q <= r; q++) for (let i = q; i <= n; i++) for (let j = q - 1; j < i; j++) {
      const s = pre[i] - pre[j], c = dp[q - 1][j] + (s - mean) * (s - mean);

  }

  metrics(vw, vh) {
    const phone = vw < 700;
    return { sw: vw, sh: vh, top: phone ? 62 : 70, bot: phone ? 70 : 80, px: phone ? 12 : 40, side: phone ? 8 : 76 };
  }

  lay(vw, vh) {
    const ab = this.props.abstand ?? 'Mittel', key = vw + 'x' + vh + ab;

    const g = 14, GAP = ab === 'Eng' ? 80 : ab === 'Weit' ? 320 : 170, PW = 10000, m = this.metrics(vw, vh);
    const cl = this.groups().map(it => {
      const hero = it[0], har = hero.w / hero.h, rest = it.slice(1), ra = rest.map(x => x.w / x.h), nn = it.length;
      const target = Math.min(2.8, Math.max(1.3, 0.95 + 0.15 * nn)), top = har > 1.75;
      let best = null;
      for (let r = 1; r <= Math.min(5, rest.length); r++) {
        if (!top && r === 1 && rest.length > 1) continue;
        const P = this.part(ra, r); if (!P) continue;
        const rows = P.map(([s, e]) => ({ s, e, S: ra.slice(s, e).reduce((x, y) => x + y, 0), k: e - s }));
        let W, H, hh, hw, Wr;
        if (!top) {

        y += (h + g) * fct;

  fitZ() { const L = this._L, m = L.m; return Math.min((m.sw - 2 * m.px) / L.PW, (m.sh - m.top - m.bot) / L.PH); }

  }

  loadHi(i) {
    const it = this._L.items[i]; if (!it || it.hi || it.src === it.th) return; it.hi = true;
    const f = this.figs()[i], el = f && f.querySelector('[data-im]'); if (!el) return;
    const tok = this.hiTok = (this.hiTok || 0) + 1, im = new Image(); im.decoding = 'async';

    im.onerror = () => { it.hi = false; };
    im.src = it.src;

  // Laufendes Nachladen abbrechen und alle großen Fassungen außer keep wieder auf klein setzen

    clearTimeout(this.hiT); this.hiTok = (this.hiTok || 0) + 1;
    const figs = this.figs();
    this._L.items.forEach((it, j) => {

      const el = figs[j] && figs[j].querySelector('[data-im]'); if (!el) return;

  tick() {
    const c = this.cam; let moved = false;
    if (this.tw) {
      const tw = this.tw, t = Math.min(1, (performance.now() - tw.t0) / tw.dur), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  }

  componentDidMount() {

  componentWillUnmount() {

  }
  afterCover(fn) {

    if (!arr) { fn(); return; }

  }
  intro() {
    if (this.dead) return;
    const figs = this.figs(), L = this._L, still = this.reduce || this.props.einblenden === false;
    figs.forEach((f, j) => {
      const it = L.items[j]; if (!it) return;
      if (still) { f._in = 1; f.style.opacity = '1'; return; }

      const an = f.animate([{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 900, delay: d, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'both' });
      an.onfinish = () => { f._in = 1; f.style.opacity = this.fi > -1 && j !== this.fi ? '0.1' : '1'; an.cancel(); };
    });
    if (!still) { const [sx, sy] = this.center(); this.flyTo(L.PW / 2, L.PH / 2, this.fitZ(), sx, sy, 2200); }
  }

  down(e) {
    if (!e.target.closest || !e.target.closest('[data-k="stage"]') || e.target.closest('button,a')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    this.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (this.ptr.size === 1) this.drag = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, t: performance.now(), vx: 0, vy: 0, moved: false, fig: e.target.closest('[data-i]') };

  }
  pinchInfo() { const [a, b] = Array.from(this.ptr.values()); return { d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
  move(e) {

      c.z = c.tz = z; c.x = c.tx = p.mx - px * z; c.y = c.ty = p.my - py * z; this.pinch = p; this.apply();

  up(e) {

    const d = this.drag; this.drag = null; this.pinch = null;
    const st = this.$('[data-k="stage"]'); if (st) st.style.cursor = 'grab';
    if (!d) return;
    if (!d.moved) { this.tap(e, d.fig); return; }
    const c = this.cam; c.tx += d.vx * 14; c.ty += d.vy * 14; this.clampT();
  }
  tap(e, fig) {
    if (fig) { const i = +fig.getAttribute('data-i'); if (this.fi === i) this.unfocus(true); else this.focus(i); return; }
    if (this.fi > -1) { this.unfocus(true); return; }
    const c = this.cam, L = this._L, wx = (e.clientX - c.x) / c.z, wy = (e.clientY - c.y) / c.z;

  wheel(e) {

  }

  renderVals() {
    const vw = this.state.vw, vh = this.state.vh, L = this.lay(vw, vh), n = L.items.length;
    const px = v => v.toFixed(1) + 'px';
    return {
      pw: px(L.PW), ph: px(L.PH),
      items: L.items.map((it, i) => ({ i, l: px(it.x), t: px(it.y), w: px(it.w), h: px(it.h), th: it.th })),
      focOn: this.state.foc > -1,
      zoomIn: () => { if (this.fi > -1) this.unfocus(false); this.zoomBy(1.6); },
      zoomOut: () => { if (this.fi > -1) this.unfocus(false); this.zoomBy(1 / 1.6); },

  }
}
