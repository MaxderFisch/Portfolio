<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Südkorea — Max Aulinger</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./seitenwechsel.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin="">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&amp;f[]=general-sans@400,500,600&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
html,body{margin:0;background:#000;color:#f2f2f2;font-family:'General Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
::selection{background:#f2f2f2;color:#000}
</style>
</helmet>

<div data-k="korn" aria-hidden="true" style="position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.05"></div>

<dc-import name="Navi" aktiv="Korea" hint-size="100%,0px"></dc-import>
<sc-if value="{{ isB }}" hint-placeholder-val="{{ true }}">
<section id="film" data-k="film" style="position:relative;height:100svh;min-height:520px;overflow:hidden;background:#000;color:#fff">
  <video data-f="vid" muted="true" loop="true" playsinline="true" preload="auto" disablepictureinpicture="true" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000"><source media="(max-aspect-ratio: 3/4)" src="assets/video/intro-korea-9x16.mp4" type="video/mp4"><source src="assets/video/intro-korea-16x9.mp4" type="video/mp4"></video>
  <div data-f="vprog" style="position:absolute;left:0;right:0;bottom:0;height:2px;background:#fff;opacity:.5;transform-origin:0 50%;transform:scaleX(0)"></div>
  <a href="#flaeche" data-k="mehr" style="opacity:0;pointer-events:none;position:absolute;right:clamp(16px,3vw,40px);bottom:clamp(30px,5vh,56px);display:flex;align-items:center;gap:12px;padding:14px 22px;border-radius:999px;background:#f2f2f2;color:#000;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 12px 40px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.16,1,.3,1)" style-hover="transform:scale(1.06)">Alle Bilder ansehen <span data-f="arrow" style="display:inline-block;font-size:15px">↓</span></a>
</section>
</sc-if>

<section id="flaeche" data-k="stage" style="position:relative;height:100svh;min-height:520px;overflow:hidden;background:#000;color:#f2f2f2;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab">
  <div data-k="sq" style="position:absolute;inset:0;transform-origin:50% 50%">
    <div data-k="plane" style="position:absolute;left:0;top:0;width:{{ pw }};height:{{ ph }};transform-origin:0 0;will-change:transform">
      <div data-k="dim" style="position:absolute;inset:-6000px;background:#000;opacity:0;z-index:5;pointer-events:none;transition:opacity .45s ease"></div>
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="0">
        <figure data-ci="{{ it.i }}" style="position:absolute;left:{{ it.l }};top:{{ it.t }};width:{{ it.w }};height:{{ it.h }};margin:0;overflow:hidden;background:#0d0d0f;z-index:1;opacity:0;cursor:pointer;transition:transform .6s cubic-bezier(.16,1,.3,1)"><img src="{{ it.th }}" alt="{{ it.cap }}" draggable="false" decoding="async" style="display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none"></figure>
      </sc-for>
    </div>
  </div>
  <div data-k="bar" style="position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;padding:44px clamp(16px,3vw,40px) clamp(12px,1.8vw,22px);background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,0));pointer-events:none;transition:opacity .35s">
    <div>
      <sc-if value="{{ isA }}" hint-placeholder-val="{{ false }}">
        <div style="overflow:hidden;padding-bottom:.06em"><h1 data-k="ttl" style="margin:0;font-family:'Clash Display',system-ui,sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,56px);line-height:.9;letter-spacing:-.03em;transform:translateY(105%)">Südkorea.</h1></div>
        <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:10px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#cfcfcf"><span>Auslandssemester</span><span data-k="hint" style="transition:opacity .6s">Ziehen, um alles zu sehen</span></div>

      <sc-if value="{{ isB }}" hint-placeholder-val="{{ true }}">
        <div style="font-family:'Clash Display',system-ui,sans-serif;font-weight:700;font-size:clamp(26px,3vw,44px);line-height:.9;letter-spacing:-.03em">Alle Bilder</div>
      </sc-if>
    </div>
    <div style="display:none;flex-wrap:nowrap;gap:5px;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none;pointer-events:auto">
      <sc-for list="{{ themes }}" as="t" hint-placeholder-count="8">
        <button onClick="{{ t.go }}" style="appearance:none;border:1px solid rgba(255,255,255,.38);border-radius:999px;padding:7px 12px;flex:0 0 auto;white-space:nowrap;font-family:'General Sans',system-ui,sans-serif;font-size:12px;font-weight:500;cursor:pointer;background:{{ t.bg }};color:{{ t.fg }};transition:background .3s,color .3s,border-color .3s" style-hover="border-color:#f2f2f2">{{ t.t }}</button>
      </sc-for>
    </div>
  </div>
</section>

<sc-if value="{{ isB }}" hint-placeholder-val="{{ true }}">
  <section style="background:#000;color:#f2f2f2;padding:clamp(50px,6vw,90px) clamp(16px,3vw,40px) 28px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:16px 30px">
    <a href="Startseite%20Stream.dc.html" style="font-family:'Clash Display',system-ui,sans-serif;font-weight:600;font-size:clamp(20px,2.2vw,30px);letter-spacing:-.01em;border-bottom:2px solid #f2f2f2;padding-bottom:4px;transition:opacity .3s" style-hover="opacity:.6">← Zurück zur Startseite</a>
    <a href="mailto:maxau.aulo@gmail.com" style="font-family:'Clash Display',system-ui,sans-serif;font-weight:600;font-size:clamp(20px,2.2vw,30px);letter-spacing:-.01em;color:#8d8d92;transition:color .3s" style-hover="color:#f2f2f2">Schreib mir</a>
  </section>
</sc-if>

<sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ lbClose }}" style="position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:7vh 6vw;cursor:zoom-out">
    <img src="{{ lbSrc }}" alt="{{ lbCap }}" style="max-width:100%;max-height:80vh;object-fit:contain;display:block">
    <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a3a3a8;text-align:center">{{ lbCap }}</div>
    <button onClick="{{ lbPrev }}" aria-label="Vorheriges Bild" style="position:absolute;left:clamp(8px,2vw,28px);top:50%;transform:translateY(-50%);appearance:none;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.4);color:#f2f2f2;width:48px;height:48px;border-radius:999px;font-size:18px;cursor:pointer" style-hover="background:#f2f2f2;color:#000">←</button>
    <button onClick="{{ lbNext }}" aria-label="Nächstes Bild" style="position:absolute;right:clamp(8px,2vw,28px);top:50%;transform:translateY(-50%);appearance:none;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.4);color:#f2f2f2;width:48px;height:48px;border-radius:999px;font-size:18px;cursor:pointer" style-hover="background:#f2f2f2;color:#000">→</button>
    <span style="position:absolute;top:20px;right:24px;font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:#f2f2f2">Schließen ✕</span>
  </div>
</sc-if>
</x-dc>

      ['moewen', 'Möwen', 600, 0, [['dsc01970'], ['dsc01971'], ['dsc01973', 'dsc01976']]],
      ['meer', 'Am Meer', 820, 10, [['dsc01512', 'dsc01427', 'dsc01515'], ['dsc01461', 'dsc01462', 'dsc01400']]],
      ['nacht', 'Nachts', 900, 10, [['nacht-linien', 'nacht-rauch', 'nacht-strasse'], ['dsc08579', 'bruecke', 'dsc09776'], ['dsc00640', 'dsc09222', 'dsc08581']]]
    ];
    const src = k => k.indexOf('dsc') === 0 ? 'assets/korea/' + k + '.webp' : k === 'bruecke' ? 'assets/korea/bruecke.webp' : 'assets/' + k + '.webp';
    const th = k => 'assets/korea/t/' + k + '.webp';
    const built = CL.map(([id, t, W, g, rows]) => {

      if (fx && t > 22700 && t < 27500) { const r = fx.getBoundingClientRect(); if (r.bottom > 0 && r.top < innerHeight) { this.streak(fx); if (Math.random() < 0.3) setTimeout(() => { if (fx.isConnected) this.streak(fx); }, 90 + Math.random() * 170); } }
    }
    this.fxT = setTimeout(() => this.feuern(), 420 + Math.random() * 1500);
  }

  renderVals() {
    const L = this.lay(), vw = this.state.vw, phone = vw < 700, v = this.variant(), act = this.state.act, lb = this.state.lb, it = lb != null ? L.items[lb] : null;
    const on = '#f2f2f2', off = 'transparent';
    return {
      isA: v === 'A', isB: v === 'B', wordBot: phone ? '104px' : 'clamp(36px,6vh,64px)', brandDisp: phone ? 'none' : 'block', swTop: phone ? '58px' : '64px',
      setA: () => this.setState({ v: 'A' }), setB: () => this.setState({ v: 'B' }),
      vaBg: v === 'A' ? on : off, vaFg: v === 'A' ? '#000' : '#f2f2f2', vbBg: v === 'B' ? on : off, vbFg: v === 'B' ? '#000' : '#f2f2f2',
      flash: L.flash.map((t, i) => ({ i, t })),
      words: [['Seoul.', 'w2'], ['Sokcho.', 'w4'], ['Seoul bei Nacht.', 'w6']].map(([t, k]) => ({ t, k })),
      pw: L.PW.toFixed(0) + 'px', ph: L.PH.toFixed(0) + 'px',
      labels: L.clusters.map(c => ({ name: c.t, l: c.x.toFixed(1) + 'px', t: (c.y - 66).toFixed(1) + 'px' })),
      items: L.items.map(m => ({ i: m.i, l: m.x.toFixed(1) + 'px', t: m.y.toFixed(1) + 'px', w: m.w.toFixed(1) + 'px', h: m.h.toFixed(1) + 'px', th: m.th, cap: m.cap || m.cl })),
      themes: [['krieger', 'Krieger'], ['tempel', 'Tempel'], ['stadt', 'Stadt'], ['gesichter', 'Gesichter'], ['meer', 'Am Meer'], ['moewen', 'Möwen'], ['nacht', 'Nachts'], ['all', 'Übersicht']].map(([id, t]) => ({ t, go: () => this.go(id), bg: act === id ? on : 'rgba(0,0,0,.35)', fg: act === id ? '#000' : '#f2f2f2' })),
      lbOpen: !!it, lbSrc: it ? it.src : '', lbCap: it ? it.cl + (it.cap ? ' · ' + it.cap : '') : '',
      lbClose: () => this.setState({ lb: null }),
      lbPrev: e => { if (e) e.stopPropagation(); this.step(-1); },
      lbNext: e => { if (e) e.stopPropagation(); this.step(1); }
    };
  }
}
</script>
